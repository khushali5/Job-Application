spring.application.name=REVIEW-SERVICE
server.port=8084

# =========================
# SERVICE URLS (DOCKER FIXED)
# =========================
job-service.url=http://job:8082
company-service.url=http://company:8083
review-service.url=http://review:8084

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:postgresql://postgres:5432/review
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Etc/UTC
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# =========================
# EUREKA (FIXED)
# =========================
eureka.client.serviceUrl.defaultZone=http://service-reg:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ❌ DO NOT USE IN DOCKER
# eureka.instance.ip-address=127.0.0.1

# =========================
# ZIPKIN
# =========================
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# =========================
# CONFIG SERVER (FIXED)
# =========================
spring.config.import=optional:configserver:http://configserver:8080

# =========================
# RABBITMQ
# =========================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always