spring.application.name=Review-Service
server.port = 8084

job-service.url=http://job-service:8082
company-service.url=http://company-service:8083
review-service.url=http://review-service:8084


#Eureka
eureka.client.enabled=true
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
logging.level.debug=DEBUG

#RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ACTUATOR
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

#Zipkin
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0

#Postgres
spring.datasource.url=jdbc:postgresql://postgres:5432/review
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Etc/UTC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
