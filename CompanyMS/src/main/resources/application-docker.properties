spring.application.name=COMPANY-SERVICE
server.port=8083

# =========================
# SERVICE URLS (DOCKER FIXED)
# =========================
job-service.url=http://job:8082
company-service.url=http://company:8083
review-service.url=http://review:8084

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:postgresql://postgres:5432/company
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Etc/UTC
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# =========================
# EUREKA (FIXED)
# =========================
eureka.client.serviceUrl.defaultZone=http://service-reg:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ❌ REMOVE THIS IN DOCKER
# eureka.instance.ip-address=127.0.0.1

# =========================
# ZIPKIN
# =========================
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# =========================
# CONFIG SERVER (FIXED)
# =========================
spring.config.import=optional:configserver:http://configserver:8080

# =========================
# RESILIENCE4J CIRCUIT BREAKER (UNCHANGED)
# =========================
resilience4j.circuitbreaker.instances.companyBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.companyBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.companyBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.companyBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.companyBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.companyBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.companyBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.companyBreaker.sliding-window-type=count_based

resilience4j.circuitbreaker.instances.companyBreaker.max-attempts=5
resilience4j.circuitbreaker.instances.companyBreaker.wait-duration=2s

resilience4j.ratelimiter.instances.companyBreaker.limitForPeriod=4
resilience4j.ratelimiter.instances.companyBreaker.limitRefreshPeriod=4
resilience4j.ratelimiter.instances.companyBreaker.timeout-duration=0

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# =========================
# RABBITMQ (OK)
# =========================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest